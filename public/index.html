<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GraySparks — Offer Generator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f9;
      color: #1a1a2e;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .logo {
      width: 40px;
      height: 40px;
      background: #1a1a2e;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: -0.5px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1a1a2e;
    }

    header p {
      font-size: 0.8rem;
      color: #666;
      margin-top: 1px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 1.75rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      margin-bottom: 1.25rem;
    }

    .card h2 {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #888;
      margin-bottom: 1.25rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    @media (max-width: 540px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    label {
      font-size: 0.8rem;
      font-weight: 500;
      color: #444;
    }

    input, select, textarea {
      border: 1.5px solid #e0e4ed;
      border-radius: 7px;
      padding: 0.55rem 0.75rem;
      font-size: 0.9rem;
      font-family: inherit;
      color: #1a1a2e;
      background: #fff;
      transition: border-color 0.15s;
      outline: none;
      width: 100%;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #1a1a2e;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .btn-generate {
      width: 100%;
      padding: 0.75rem;
      background: #1a1a2e;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      margin-top: 0.5rem;
    }

    .btn-generate:hover { background: #2d2d4e; }
    .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; }

    .output-card {
      display: none;
      background: #fff;
      border-radius: 12px;
      padding: 1.75rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      margin-bottom: 1.25rem;
    }

    .output-card.visible { display: block; }

    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .output-header h2 {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #888;
    }

    .btn-copy {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.85rem;
      background: #f0f2f7;
      color: #1a1a2e;
      border: none;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-copy:hover { background: #e2e6ef; }
    .btn-copy.copied { background: #d4edda; color: #1a6b35; }

    #output-text {
      white-space: pre-wrap;
      font-size: 0.92rem;
      line-height: 1.7;
      color: #1a1a2e;
      background: #f9fafc;
      border-radius: 7px;
      padding: 1rem;
      border: 1.5px solid #e0e4ed;
    }

    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid #ffffff55;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      color: #c0392b;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      display: none;
    }

    .tip {
      font-size: 0.75rem;
      color: #999;
      margin-top: 0.35rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">GS</div>
      <div>
        <h1>GraySparks Ltd</h1>
        <p>Lead Offer Generator</p>
      </div>
    </header>

    <div class="card">
      <h2>Lead Details</h2>
      <div style="display:flex;flex-direction:column;gap:1rem;">

        <div class="grid-2">
          <div class="field">
            <label for="customerName">Customer Name</label>
            <input type="text" id="customerName" placeholder="e.g. Rashid H." />
          </div>
          <div class="field">
            <label for="location">Location</label>
            <input type="text" id="location" placeholder="e.g. Mortlake, SW14, London" />
          </div>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="budget">Budget (£)</label>
            <input type="text" id="budget" placeholder="e.g. 3500" />
          </div>
          <div class="field">
            <label for="timeline">Timeline</label>
            <select id="timeline">
              <option value="">— Select —</option>
              <option value="Flexible">Flexible</option>
              <option value="ASAP">ASAP</option>
              <option value="Within 1 month">Within 1 month</option>
              <option value="1–3 months">1–3 months</option>
              <option value="3+ months">3+ months</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="dimensions">Dimensions / Measurements</label>
          <input type="text" id="dimensions" placeholder="e.g. Sides x2 = 5M, Front = 6.5M, Gate opening = 1M" />
          <span class="tip">Paste any sizes the customer mentioned</span>
        </div>

        <div class="field">
          <label for="jobType">Job Type</label>
          <select id="jobType">
            <option value="">— Not specified —</option>
            <option value="Supply & Install">Supply &amp; Install</option>
            <option value="Install Only">Install Only</option>
            <option value="Supply & Install or Install Only">Either (Supply &amp; Install or Install Only)</option>
          </select>
        </div>

        <div class="field">
          <label for="description">Job Description <span style="color:#c0392b">*</span></label>
          <textarea id="description" placeholder="Paste the customer's description here…"></textarea>
        </div>

        <button class="btn-generate" id="generateBtn" onclick="generate()">
          <span id="btnText">Generate Offer Message</span>
          <div class="spinner" id="spinner"></div>
        </button>
        <div class="error-msg" id="errorMsg"></div>

      </div>
    </div>

    <div class="output-card" id="outputCard">
      <div class="output-header">
        <h2>Generated Message</h2>
        <button class="btn-copy" id="copyBtn" onclick="copyMessage()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          Copy
        </button>
      </div>
      <div id="output-text"></div>
    </div>
  </div>

  <script>
    async function generate() {
      const btn = document.getElementById('generateBtn');
      const btnText = document.getElementById('btnText');
      const spinner = document.getElementById('spinner');
      const errorMsg = document.getElementById('errorMsg');
      const outputCard = document.getElementById('outputCard');

      const description = document.getElementById('description').value.trim();
      if (!description) {
        errorMsg.textContent = 'Please enter a job description.';
        errorMsg.style.display = 'block';
        return;
      }

      errorMsg.style.display = 'none';
      btn.disabled = true;
      btnText.style.display = 'none';
      spinner.style.display = 'block';
      outputCard.classList.remove('visible');

      const payload = {
        customerName: document.getElementById('customerName').value.trim(),
        location: document.getElementById('location').value.trim(),
        budget: document.getElementById('budget').value.trim(),
        timeline: document.getElementById('timeline').value,
        dimensions: document.getElementById('dimensions').value.trim(),
        jobType: document.getElementById('jobType').value,
        description,
      };

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Unknown error');

        document.getElementById('output-text').textContent = data.message;
        outputCard.classList.add('visible');

        const copyBtn = document.getElementById('copyBtn');
        copyBtn.textContent = 'Copy';
        copyBtn.className = 'btn-copy';
        copyBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Copy`;
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = 'block';
      } finally {
        btn.disabled = false;
        btnText.style.display = 'inline';
        spinner.style.display = 'none';
      }
    }

    function copyMessage() {
      const text = document.getElementById('output-text').textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg> Copied!`;
        btn.className = 'btn-copy copied';
        setTimeout(() => {
          btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Copy`;
          btn.className = 'btn-copy';
        }, 2000);
      });
    }

    document.getElementById('description').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.metaKey) generate();
    });
  </script>
</body>
</html>
